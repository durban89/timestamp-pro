<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .bg-matte { fill: #020617; }
    .stream-raw { fill: #334155; }
    .stream-formatted { fill: #10B981; }
    .accent-dot { fill: #6EE7B7; }
  </style>

  <!-- 1. 纯正极客深黑底座 -->
  <rect width="512" height="512" rx="112" class="bg-matte"/>
  
  <!-- 2. 大厂级几何格式化光束 (组合数据流) -->
  <g transform="translate(46, 46)">
    <!-- 左侧：散落、代表未清洗原始数据的阶梯光束 -->
    <path d="M 120 100 L 190 100 L 130 220 L 60 220 Z" class="stream-raw" opacity="0.4"/>
    <path d="M 150 140 L 220 140 L 160 260 L 90 260 Z" class="stream-raw"/>
    <path d="M 180 180 L 250 180 L 190 300 L 120 300 Z" class="stream-raw" opacity="0.7"/>

    <!-- 右侧：平行、代表经过转换清洗后规整的标准化日期线 (Data Line) -->
    <path d="M 240 120 L 360 120 L 290 260 L 170 260 Z" class="stream-formatted"/>
    <path d="M 270 160 L 360 160 L 310 260 L 220 260 Z" class="stream-formatted" opacity="0.8"/>
    <path d="M 300 200 L 360 200 L 330 260 L 270 260 Z" class="stream-formatted" opacity="0.5"/>
  </g>
  
  <!-- 3. 点睛之笔：一颗精密的、代表最新时刻（Now）的转换粒子 (Timestamp Trigger) -->
  <circle cx="366" cy="166" r="12" class="accent-dot"/>
  <circle cx="366" cy="166" r="24" fill="none" stroke="#10B981" stroke-width="2" opacity="0.4"/>
</svg>
